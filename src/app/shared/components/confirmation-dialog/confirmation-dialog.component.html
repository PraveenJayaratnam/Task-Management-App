<div
  class="confirmation-dialog"
  [ngClass]="'dialog-' + type"
>
  <div class="dialog-header">
    <div class="icon-container">
      <mat-icon [class]="type === 'destructive' ? 'warning-icon' : 'confirm-icon'">
        {{ type === 'destructive' ? 'warning' : 'check_circle' }}
      </mat-icon>
    </div>
    <h2
      mat-dialog-title
      class="dialog-title"
    >
      {{ title }}
    </h2>
  </div>

  <mat-dialog-content class="dialog-content">
    <p class="confirmation-message">{{ message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions
    class="dialog-actions"
    align="end"
  >
    <button
      mat-button
      (click)="onCancel()"
      type="button"
      class="cancel-button"
    >
      <mat-icon>close</mat-icon>
      Cancel
    </button>
    <button
      mat-raised-button
      [color]="type === 'destructive' ? 'warn' : 'primary'"
      (click)="onConfirm()"
      type="button"
      class="confirm-button"
    >
      <mat-icon>check</mat-icon>
      {{ confirmText }}
    </button>
  </mat-dialog-actions>
</div>
