<div class="container-fluid py-4">
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h1 class="display-4 mb-2">Task Management</h1>
          @if (authService.user) {
            <p class="text-muted mb-0">
              <i class="bi bi-person-circle me-2"></i>
              Welcome, <strong>{{ authService.user.username }}</strong
              >!
            </p>
          }
        </div>
        <div class="d-flex gap-2">
          <button
            (click)="loadTasks()"
            class="btn btn-info me-2"
          >
            <i class="bi bi-arrow-clockwise me-2"></i>Refresh Tasks
          </button>
          <button
            (click)="onAddTask()"
            class="btn btn-primary"
            [disabled]="showForm()"
          >
            <i class="bi bi-plus-circle me-2"></i>Add Task
          </button>
          <button
            (click)="onLogout()"
            class="btn btn-outline-danger"
          >
            <i class="bi bi-box-arrow-right me-2"></i>Logout
          </button>
        </div>
      </div>
    </div>
  </div>

  @if (message()) {
    <div class="row mb-3">
      <div class="col-12">
        <div
          class="alert alert-dismissible fade show"
          [class]="'alert-' + messageType()"
        >
          {{ message() }}
          <button
            type="button"
            class="btn-close"
            (click)="clearMessage()"
            aria-label="Close"
          ></button>
        </div>
      </div>
    </div>
  }

  <div class="row">
    <div
      class="col-lg-8"
      [class.col-12]="!showForm()"
    >
      <app-task-list
        [tasks]="tasks()"
        [paginationData]="paginationData()"
        [loading]="loading()"
        (editTask)="onEditTask($event)"
        (deleteTask)="onDeleteTask($event)"
        (pageChange)="onPageChange($event)"
        (searchChange)="onSearchChange($event)"
        (sortChange)="onSortChange($event)"
      ></app-task-list>
    </div>

    <div
      class="col-lg-4"
      [class.d-none]="!showForm()"
    >
      <app-task-form
        [task]="selectedTask()"
        [loading]="formLoading()"
        (saveTask)="onSaveTask($event)"
        (taskCancel)="onCancelForm()"
      ></app-task-form>
    </div>
  </div>
</div>
