<div class="container-fluid py-4">
  <div class="row mb-2">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h1 class="display-4 mb-2">Task Management</h1>
          @if (authService.user) {
            <p class="text-muted mb-0">
              <i class="bi bi-person-circle me-2"></i>
              Welcome,
              <strong>{{
                authService.user.firstName || authService.user.username
              }}</strong
              >!
            </p>
          }
        </div>
        <div class="d-flex gap-2">
          <button
            (click)="onLogout()"
            class="btn btn-outline-danger"
          >
            <i class="bi bi-box-arrow-right me-2"></i>Logout
          </button>
        </div>
      </div>
    </div>
  </div>

  @if (message()) {
    <div class="row mb-3">
      <div class="col-12">
        <div
          class="alert alert-dismissible fade show"
          [class]="'alert-' + messageType()"
        >
          {{ message() }}
          <button
            type="button"
            class="btn-close"
            (click)="clearMessage()"
            aria-label="Close"
          ></button>
        </div>
      </div>
    </div>
  }

  <app-task-list
    [tasks]="tasks()"
    [paginationData]="paginationData()"
    [loading]="loading()"
    [currentSort]="getCurrentSort()"
    (addTask)="onAddTask()"
    (editTask)="onEditTask()"
    (deleteTask)="onDeleteTask($event)"
    (pageChange)="onPageChange($event)"
    (searchChange)="onSearchChange($event)"
    (statusFilterChange)="onStatusFilterChange($event)"
    (priorityFilterChange)="onPriorityFilterChange($event)"
    (sortChange)="onSortChange($event)"
    (refreshTasks)="loadTasks()"
  ></app-task-list>
</div>
