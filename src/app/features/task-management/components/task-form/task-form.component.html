<div class="card">
  <div class="card-header">
    <div class="d-flex justify-content-between align-items-center">
      <h5 class="card-title mb-0">
        <i class="bi bi-plus-circle me-2"></i>
        {{ isEditMode() ? 'Edit Task' : 'Add New Task' }}
      </h5>
      <button
        (click)="onCancelClick()"
        class="btn btn-outline-secondary btn-sm"
      >
        <i class="bi bi-x-lg"></i> Cancel
      </button>
    </div>
  </div>

  <div class="card-body">
    <form
      [formGroup]="taskForm"
      (ngSubmit)="onSubmit()"
    >
      <div class="row">
        <div class="col-md-6 mb-3">
          <label
            for="title"
            class="form-label"
          >
            <i class="bi bi-tag me-1"></i>Title *
          </label>
          <input
            type="text"
            id="title"
            formControlName="title"
            class="form-control"
            [class.is-invalid]="taskForm.get('title')?.invalid && submitted()"
            placeholder="Enter task title"
          />
          @if (taskForm.get('title')?.invalid && submitted()) {
            <div class="invalid-feedback">Title is required</div>
          }
        </div>

        <div class="col-md-6 mb-3">
          <label
            for="status"
            class="form-label"
          >
            <i class="bi bi-flag me-1"></i>Status *
          </label>
          <select
            id="status"
            formControlName="status"
            class="form-select"
            [class.is-invalid]="taskForm.get('status')?.invalid && submitted()"
          >
            <option value="">Select Status</option>
            @for (option of taskStatusOptions; track option.value) {
              <option [value]="option.value">{{ option.label }}</option>
            }
          </select>
          @if (taskForm.get('status')?.invalid && submitted()) {
            <div class="invalid-feedback">Status is required</div>
          }
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label
            for="priority"
            class="form-label"
          >
            <i class="bi bi-exclamation-triangle me-1"></i>Priority
          </label>
          <select
            id="priority"
            formControlName="priority"
            class="form-select"
          >
            <option value="">Select Priority</option>
            @for (option of taskPriorityOptions; track option.value) {
              <option [value]="option.value">{{ option.label }}</option>
            }
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label
          for="description"
          class="form-label"
        >
          <i class="bi bi-file-text me-1"></i>Description
        </label>
        <textarea
          id="description"
          formControlName="description"
          rows="3"
          class="form-control"
          placeholder="Enter task description (optional)"
        ></textarea>
      </div>

      <div class="mb-3">
        <label
          for="dueDate"
          class="form-label"
        >
          <i class="bi bi-calendar me-1"></i>Due Date
        </label>
        <input
          type="date"
          id="dueDate"
          formControlName="dueDate"
          class="form-control"
        />
      </div>

      <div class="d-flex justify-content-end gap-2">
        <button
          type="button"
          (click)="onCancelClick()"
          class="btn btn-outline-secondary"
        >
          <i class="bi bi-x-lg me-1"></i>Cancel
        </button>
        <button
          type="submit"
          [disabled]="loading()"
          class="btn btn-primary"
        >
          @if (loading()) {
            <span
              class="spinner-border spinner-border-sm me-2"
              role="status"
            ></span>
            Saving...
          } @else {
            <i class="bi bi-check-lg me-1"></i>
            {{ isEditMode() ? 'Update Task' : 'Create Task' }}
          }
        </button>
      </div>
    </form>
  </div>
</div>
